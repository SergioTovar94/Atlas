version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: prueba_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
      - ./data:/data
      - ./etl:/etl
      - ./api:/api
      - ./dashboard:/dashboard
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: